# Alternative way to publish the app to GitHub Pages (run manually from the Actions tab).
# Requires: repository Settings -> Pages -> Source = "GitHub Actions", and free
# Actions artifact storage on the account. The default route needs neither: set the
# Pages source to "Deploy from a branch" (main, / root) and the site is served as-is.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest icon.svg sw.js css js models vendor _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
